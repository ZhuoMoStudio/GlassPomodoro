name: Build GlassPomodoro

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== Release 签名配置（仅 Tag 发布时） =====
      - name: Decode keystore from secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE_B64" ]; then
            echo "$KEYSTORE_FILE_B64" | base64 -d > $HOME/keystore.jks 2>/dev/null
            if [ -s "$HOME/keystore.jks" ]; then
              echo "KEYSTORE_PATH=$HOME/keystore.jks" >> $GITHUB_ENV
              echo "OK keystore loaded"
            else
              echo "WARN base64 decode failed"
            fi
          else
            echo "INFO using debug signing"
          fi

      # ===== 按事件构建 =====
      # - PR:   assembleDebug（快速验证编译）
      # - main: assembleRelease（artifact）
      # - Tag:  assembleRelease（GitHub Release）
      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK for end users
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="2.0.0"; fi
          SUFFIX=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then SUFFIX="-debug"; fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "GlassPomodoro-${VERSION}${SUFFIX}.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "app/build/outputs/apk/release/app-release-unsigned.apk" "GlassPomodoro-${VERSION}${SUFFIX}.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "GlassPomodoro-${VERSION}${SUFFIX}.apk"
          fi
          ls -la GlassPomodoro-*.apk

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GlassPomodoro-APK
          path: GlassPomodoro-*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GlassPomodoro-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
